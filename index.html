        (function() {

                var themeMode = 'old-dark'
                var accentColor = 'red'
                if (cached) {
                    var parsed = JSON.parse(cached)
                    themeMode = parsed.themeMode || 'old-dark'
                    accentColor = parsed.accentColor || 'red'
                }
                var themeClass = ''
                if (themeMode === 'dark') themeClass = 'dark-mode'
                else if (themeMode === 'old-dark') themeClass = 'old-dark-mode'
                else if (themeMode === 'red-dark') themeClass = 'red-dark-mode'
                else if (themeMode === 'blue-light') themeClass = 'blue-light-mode'
                else if (themeMode === 'red-light') themeClass = 'red-light-mode'
                if (themeClass) document.documentElement.classList.add(themeClass)
                document.documentElement.classList.add('accent-' + accentColor)
            } catch (e) {
                document.documentElement.classList.add('old-dark-mode')
                document.documentElement.classList.add('accent-red')
            }
        })()

    <!-- A document restored from a browser's cache after a deploy asks for the
         hashed bundle it was built against, which is no longer on the origin.
         Nothing downstream recovers from that on its own: the entry script
         never runs, so the app that would have drawn the page never starts and
         the reader is left on an empty document until they reload by hand.

         The document itself is served must-revalidate, so re-fetching it is
         enough to pick up the current hashes. `cache: "reload"` is what makes
         that re-fetch reach the network and replace the cached copy — a plain
         location.reload() may be answered from the same stale entry that
         caused this. One attempt per tab, recorded before it is taken, so a
         genuine outage costs a single reload rather than a loop.

         This listens after the reporter above, so the failure is still
         reported before the page goes away. -->

        // rejects rather than firing an error event, so the recovery is a

        // per tab, recorded before it is taken, so a genuine outage costs a
        // single reload rather than a loop.

            if (sessionStorage.getItem(KEY) === "1") return;
            sessionStorage.setItem(KEY, "1");

          // the reader sees a reload rather than a blank page.

          window.__recoverStaleShell();
