name: Remote Edit

on:
  issues:
    types: [ opened ]

jobs:
  remote-edit:
    # Only run when opened by the repo owner or the issue carries the "remote-edit" label
    if: >
      github.actor == 'bradley-t-t' ||
      contains(github.event.issue.labels.*.name, 'remote-edit')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configure Git for GitHub packages
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        run: npm ci

      - name: Apply the requested changes
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-4-20250514 --max-turns 50 --allowedTools Edit,Write,Read,Glob,Grep,Bash"
          prompt: |
            ${{ github.event.issue.body }}

            After making the requested changes:
            1. Run 'npm run lint' and fix any errors
            2. Run 'npm run build' (with CI=false env var) to verify the build passes
            3. Do NOT commit — the workflow handles that

      - name: Run lint
        run: npm run lint

      - name: Run build
        env:
          CI: false
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Open a pull request against develop
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          branch="issue-${ISSUE_NUMBER}"
          git config user.name "bradley-t-t"
          git config user.email "bradley-t-t@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$ISSUE_TITLE" -m "Closes #${ISSUE_NUMBER}"
          git push origin "$branch"
          url=$(gh pr create --base develop --head "$branch" \
            --title "$ISSUE_TITLE" --body "Closes #${ISSUE_NUMBER}")
          echo "url=$url" >> $GITHUB_OUTPUT
          gh pr merge "$branch" --auto --squash

      - name: Comment with the pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Opened ${{ steps.pr.outputs.url }} against `develop` with auto-merge enabled. It will land once CI passes.'
            });

      - name: Comment on no changes
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'The request was processed but no file changes were made.'
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'The remote edit failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
